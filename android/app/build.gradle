plugins { id 'com.android.application' }

android {
    namespace 'app.frankesso.android'
    compileSdk 35
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'app.frankesso.android'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '2.0.0-dev-bundled-preview.4'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static' }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.31.5' }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/upstream-notices')
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/bundled-model')
    androidResources { noCompress += 'gguf' }
}

def notice = tasks.register('copyProjectLicense', Copy) {
    from rootProject.file('../LICENSE')
    rename { 'Frankesso-MIT.txt' }
    into layout.buildDirectory.dir('generated/upstream-notices')
}
def modelHelper = rootProject.file('scripts/bundled_model.py')
def modelAssets = layout.buildDirectory.dir('generated/bundled-model')
def localModel = providers.environmentVariable('FRANKESSO_MODEL_FILE')
def bundleModel = tasks.register('prepareBundledModel', Exec) {
    inputs.file(modelHelper)
    if (localModel.isPresent()) inputs.file(localModel.get())
    outputs.file(modelAssets.map { it.file('qwen2.5-0.5b-instruct-q4_k_m.gguf') })
    commandLine providers.environmentVariable('PYTHON').orElse('python3').get(),
            modelHelper, 'prepare', modelAssets.get().asFile
}
tasks.named('preBuild').configure { dependsOn notice, bundleModel }
