name: Android bundled-model debug build
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  APK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ env.APK_SOURCE_SHA }}
      - name: Verify Android tooling
        run: |
          java -version
          sdk="${ANDROID_HOME:?Android SDK required on the runner}"
          if ! test -f "$sdk/platforms/android-35/android.jar" ||
             ! test -x "$sdk/build-tools/35.0.0/aapt" ||
             ! test -f "$sdk/ndk/29.0.14206865/source.properties" ||
             ! test -x "$sdk/cmake/3.31.5/bin/cmake"; then
            manager="$(find "$sdk/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
            test -x "$manager"
            "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.31.5'
          fi
      - name: Install pinned Gradle
        run: |
          archive="$RUNNER_TEMP/gradle-8.11.1-bin.zip"
          curl -fLSs --retry 3 https://github.com/gradle/gradle-distributions/releases/download/v8.11.1/gradle-8.11.1-bin.zip -o "$archive"
          echo "f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - name: Run host checks
        run: bash android/tests/run-host-checks.sh
      - name: Build APK and verify manifest
        run: |
          gradle --no-daemon -p android :app:assembleDebug :app:lintDebug
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          python3 android/scripts/bundled_model.py verify-apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/app-badging.txt"
          grep -F "name='app.frankesso.android' versionCode='5' versionName='2.0.0-dev-bundled-preview.5'" "$RUNNER_TEMP/app-badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | tee "$RUNNER_TEMP/app-permissions.txt"
          if grep -q "uses-permission" "$RUNNER_TEMP/app-permissions.txt"; then
            echo "The Android app must not request permissions."
            exit 1
          fi
          unzip -l "$apk" 'lib/arm64-v8a/libfrankesso.so' | grep -F 'lib/arm64-v8a/libfrankesso.so'
          mv "$apk" "$RUNNER_TEMP/Frankesso-Android-bundled-${APK_SOURCE_SHA:0:7}-debug.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ${{ runner.temp }}/Frankesso-Android-bundled-*-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Check runner emulator access
        id: emulator-preflight
        run: |
          if test -r /dev/kvm && test -w /dev/kvm; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::This runner cannot access KVM. Android offline UI testing did not run; verify on a physical device."
          fi
      - name: Offline reply on Android with ARM64 translation
        if: steps.emulator-preflight.outputs.available == 'true'
        timeout-minutes: 18
        run: |
          sdk="${ANDROID_HOME:?}"
          manager="$(find "$sdk/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          "$manager" --sdk_root="$sdk" 'emulator' 'platform-tools' 'system-images;android-30;google_apis;x86_64'
          export PATH="$sdk/emulator:$sdk/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/frankesso-android-home"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$(dirname "$manager")/avdmanager" create avd --force --name frankesso-ci --path "$ANDROID_AVD_HOME/frankesso-ci.avd" --package 'system-images;android-30;google_apis;x86_64'
          test -s "$ANDROID_AVD_HOME/frankesso-ci.avd/config.ini"
          if ! test -s "$ANDROID_AVD_HOME/frankesso-ci.ini"; then
            printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-30\n' "$ANDROID_AVD_HOME/frankesso-ci.avd" >"$ANDROID_AVD_HOME/frankesso-ci.ini"
          fi
          emulator -list-avds | grep -x frankesso-ci
          emulator -accel-check
          emulator -avd frankesso-ci -no-window -gpu swiftshader_indirect -no-audio -no-snapshot -no-boot-anim -partition-size 4096 -memory 3072 >"$RUNNER_TEMP/emulator.log" 2>&1 &
          trap 'tail -100 "$RUNNER_TEMP/emulator.log"; timeout 15 adb logcat -d -s AndroidRuntime libc DEBUG llama || true' ERR
          timeout --kill-after=5s 240 adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 3; done'
          adb shell getprop ro.product.cpu.abilist | grep -F 'arm64-v8a'
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb install --abi arm64-v8a "$RUNNER_TEMP/Frankesso-Android-bundled-${APK_SOURCE_SHA:0:7}-debug.apk"
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell settings put global airplane_mode_on 1
          adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true
          adb shell settings get global airplane_mode_on | grep -x 1
          adb shell am start -W -n app.frankesso.android/.MainActivity
          python3 android/tests/check-offline-emulator.py
          adb exec-out screencap -p > "$RUNNER_TEMP/Frankesso-Android-offline-chat.png"
      - name: Save Android offline-chat screenshot
        if: steps.emulator-preflight.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ${{ runner.temp }}/Frankesso-Android-offline-chat.png
          archive: false
          if-no-files-found: error
          retention-days: 7
